# Default values for arepos-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: arch/arepos-server
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.11.0"

# Blue/Green deployment settings
# When enabled:
# - chart creates two deployments: <fullname>-blue and <fullname>-green
# - service routes traffic only to pods with activeColor label
blueGreen:
  enabled: false
  # Traffic selector for service ("blue" or "green")
  activeColor: "blue"
  image:
    # If empty, fallback to .image.tag
    blueTag: ""
    # If empty, fallback to .image.tag
    greenTag: ""

# Deployment metadata used to force rollout on each deploy.
deployMetadata:
  buildId: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: arepos-server.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to set up the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 30
  timeoutSeconds: 5
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Writable path for JVM temp files with readOnlyRootFilesystem.
volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: arepos
    username: arepos
    password: arepos
    postgresPassword: arepos
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Database configuration
database:
  # Database host (service name or external host)
  # When postgresql.enabled=true, this will be automatically set to postgresql service
  host: ""
  # Database port
  port: 5432
  # Database name (should match postgresql.auth.database)
  name: arepos
  # Database username (should match postgresql.auth.username)
  username: arepos
  # Database password (if not set, will use postgresql.auth.password)
  # For production, use existingSecret instead
  password: ""
  # Use existing secret for database credentials
  # If set, the secret must contain keys: DB_URL, DB_USERNAME, DB_PASSWORD
  existingSecret: ""
  # Secret key for DB_URL (if using existingSecret)
  secretKeyUrl: "DB_URL"
  # Secret key for DB_USERNAME (if using existingSecret)
  secretKeyUsername: "DB_USERNAME"
  # Secret key for DB_PASSWORD (if using existingSecret)
  secretKeyPassword: "DB_PASSWORD"

# MinIO configuration (S3-compatible storage for file uploads)
minio:
  enabled: true
  bucket: arepos-files
  image:
    repository: minio/minio
    tag: "RELEASE.2025-09-07T16-13-09Z"
    pullPolicy: IfNotPresent
  auth:
    accessKey: minioadmin
    secretKey: minioadmin
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # Ingress for MinIO Console (Web UI)
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: minio-console.arepos-server.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: minio-console-tls
    #    hosts:
    #      - minio-console.arepos-server.local

# Additional environment variables
env: []
# - name: SPRING_PROFILES_ACTIVE
#   value: "production"
# Model live sync outbox (application.yaml: arepos.model-sync.*):
# - name: MODEL_SYNC_OUTBOX_ENABLED
#   value: "false"
# - name: MODEL_SYNC_OUTBOX_PUBLISH_MS
#   value: "500"
# - name: MODEL_SYNC_OUTBOX_BATCH_SIZE
#   value: "50"
# Keycloak-compatible OIDC SSO (opt-in; leave unset to keep SSO disabled):
# - name: OIDC_ENABLED
#   value: "auto"
# - name: OIDC_ISSUER_URI
#   value: "https://idp.example.com/realms/app/"
# - name: OIDC_CLIENT_ID
#   value: "warchi"
# - name: OIDC_REDIRECT_URI
#   value: "https://app.example.com/auth/oidc/callback"
# - name: OIDC_POST_LOGOUT_URI
#   value: "https://app.example.com/"
# - name: OIDC_FRONTEND_URL
#   value: "https://app.example.com/"
# - name: OIDC_SCOPE
#   value: "openid profile email"
# - name: OIDC_DISPLAY_NAME
#   value: "SSO"
# Put OIDC_CLIENT_SECRET in envSecret / external secret store.

# Restrict arepos-server traffic (enable after warchi release name/labels are confirmed).
networkPolicy:
  enabled: false
  ingress:
    warchiPodLabels:
      app.kubernetes.io/name: warchi
  egress:
    allowDns: true
    allowPostgresql: true
    allowMinio: true
    allowCerbos: true
    # External TCP endpoints (managed DB, object storage) when in-cluster deps are disabled.
    externalTcp: []

# Cerbos authorization configuration
cerbos:
  enabled: true
  deploy: false
  host: "cerbos"
  port: 3592
  timeoutMs: 1000
  bundleVersion: ""
  image:
    repository: ghcr.io/cerbos/cerbos
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  healthPath: "/_cerbos/health"

