# nonk8s
# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: feedback_item
  rules:
    - name: admin-manage
      actions: ["manage"]
      effect: EFFECT_ALLOW
      roles:
        - admin

    - name: public-view
      actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - reader
        - editor
        - architect
        - viewer
        - admin

    - name: authenticated-create-vote-comment
      actions: ["create", "vote", "comment"]
      effect: EFFECT_ALLOW
      roles:
        - reader
        - editor
        - architect
        - viewer
        - admin

    - name: author-edit-delete-when-new
      actions: ["edit", "delete"]
      effect: EFFECT_ALLOW
      roles:
        - reader
        - editor
        - architect
        - viewer
        - admin
      condition:
        match:
          expr: request.resource.attr.isAuthor == true && request.resource.attr.status == "new"
