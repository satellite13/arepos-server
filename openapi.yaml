openapi: 3.0.3
info:
  title: Arepos Server API
  description: REST API для управления моделями, узлами, связями и компонентами
  version: 0.0.1-SNAPSHOT
  contact:
    name: API Support

servers:
  - url: http://arepos-server.arch.svc.cluster.local:8080
    description: Локальный сервер разработки
  - url: https://api.example.com
    description: Продакшн сервер

tags:
  - name: users
    description: Управление пользователями
  - name: models
    description: Управление моделями
  - name: nodes
    description: Управление узлами
  - name: relations
    description: Управление связями
  - name: components
    description: Управление компонентами
  - name: links
    description: Управление связями между узлами
  - name: notations
    description: Управление нотациями
  - name: node-types
    description: Управление типами узлов
  - name: link-types
    description: Управление типами связей
  - name: relation-rules
    description: Управление правилами связей
  - name: audit-log
    description: Просмотр журнала аудита

paths:
  /api/v1/users:
    get:
      tags:
        - users
      summary: Список пользователей
      description: Возвращает список пользователей с поддержкой пагинации и фильтрации
      parameters:
        - name: page
          in: query
          description: Номер страницы (начиная с 0)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Размер страницы
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: Параметры сортировки (например, email,asc)
          schema:
            type: string
        - name: email
          in: query
          description: Фильтр по email (поиск по подстроке)
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUserResponse'
    post:
      tags:
        - users
      summary: Создать пользователя
      description: Создает нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Пользователь с таким email уже существует
        '400':
          description: Неверный запрос

  /api/v1/users/{id}:
    get:
      tags:
        - users
      summary: Получить пользователя по ID
      parameters:
        - name: id
          in: path
          required: true
          description: UUID пользователя
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Пользователь не найден
    put:
      tags:
        - users
      summary: Обновить пользователя
      parameters:
        - name: id
          in: path
          required: true
          description: UUID пользователя
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Пользователь обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Пользователь не найден
        '409':
          description: Пользователь с таким email уже существует
    delete:
      tags:
        - users
      summary: Удалить пользователя
      parameters:
        - name: id
          in: path
          required: true
          description: UUID пользователя
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Пользователь удален
        '404':
          description: Пользователь не найден

  /api/v1/models:
    get:
      tags:
        - models
      summary: Список моделей
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          description: Фильтр по владельцу
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: Фильтр по имени (поиск по подстроке)
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageModelResponse'
    post:
      tags:
        - models
      summary: Создать модель
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
      responses:
        '201':
          description: Модель создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '404':
          description: Владелец не найден
        '409':
          description: Модель с таким name и version уже существует
        '400':
          description: Неверный запрос

  /api/v1/models/{id}:
    get:
      tags:
        - models
      summary: Получить модель по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '404':
          description: Модель не найдена
    put:
      tags:
        - models
      summary: Обновить модель
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdateRequest'
      responses:
        '200':
          description: Модель обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '404':
          description: Модель или владелец не найдены
        '409':
          description: Модель с таким name и version уже существует
    delete:
      tags:
        - models
      summary: Удалить модель
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Модель удалена
        '404':
          description: Модель не найдена

  /api/v1/nodes:
    get:
      tags:
        - nodes
      summary: Список узлов
      parameters:
        - name: page
          in: query
