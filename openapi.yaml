            type: string
            format: uuid
        - name: ownerId
          in: query
          description: Фильтр по владельцу
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: Фильтр по имени (поиск по подстроке)
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
