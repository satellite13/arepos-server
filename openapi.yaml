    put:
      tags:
        - components
      summary: Обновить компонент
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentUpdateRequest'
      responses:
        '200':
          description: Компонент обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentResponse'
        '404':
          description: Компонент, владелец, нотация или тип узла не найдены
