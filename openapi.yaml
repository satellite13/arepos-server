      summary: Создать узел
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRequest'
      responses:
        '201':
          description: Узел создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '404':
          description: Модель, владелец или тип узла не найдены
        '400':
          description: Неверный запрос

  /api/v1/nodes/{id}:
    get:
      tags:
        - nodes
      summary: Получить узел по ID
      parameters:
        - name: id
          in: path
          required: true
