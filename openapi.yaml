          schema:
            type: string
            format: uuid
        - name: ownerId
          in: query
          description: Фильтр по владельцу
          schema:
            type: string
            format: uuid
        - name: sourceId
          in: query
          description: Фильтр по исходному узлу
          schema:
            type: string
            format: uuid
        - name: targetId
          in: query
          description: Фильтр по целевому узлу
          schema:
            type: string
            format: uuid
        - name: linkTypeId
          in: query
          description: Фильтр по типу связи
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
