    put:
      tags:
        - nodes
      summary: Обновить узел
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdateRequest'
      responses:
        '200':
          description: Узел обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '404':
          description: Узел, модель, владелец или тип узла не найдены
        '400':
          description: Узел не может быть своим родителем
    delete:
      tags:
        - nodes
      summary: Удалить узел
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Узел удален
        '404':
          description: Узел не найден

