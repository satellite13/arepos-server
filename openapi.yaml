components:
  schemas:
    # Общие схемы для пагинации
    Pageable:
      type: object
      properties:
        page:
          type: integer
          description: Номер страницы (начиная с 0)
        size:
          type: integer
          description: Размер страницы
        sort:
          type: array
          items:
            type: string
          description: Параметры сортировки

    PageInfo:
      type: object
      description: Метаданные пагинации (Spring Data Page)
      properties:
        totalElements:
          type: integer
          format: int64
          description: Общее количество элементов
        totalPages:
          type: integer
          description: Общее количество страниц
        size:
          type: integer
          description: Размер страницы
        number:
          type: integer
          description: Номер текущей страницы (с 0)
        first:
          type: boolean
          description: Первая страница
        last:
          type: boolean
          description: Последняя страница
        numberOfElements:
          type: integer
          description: Количество элементов на текущей странице
        empty:
          type: boolean
          description: Пустая страница
        sort:
          type: object
          nullable: true
          description: Параметры сортировки

    # Пользователи
    UserRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
        attrs:
          type: string
          description: Дополнительные атрибуты в формате JSON
          nullable: true

