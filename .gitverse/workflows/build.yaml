name: Build ArchRepo Server
on:
 push:
jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: APT Update
        run: apt update
      - name: Install JRE
        run: apt install default-jre
      - name: Clone repo
        run: git clone https://${{ gitverse.token }}@gitverse.ru/${{ gitverse.repository }}.git .
      - name: Build
        run: ./gradlew build
