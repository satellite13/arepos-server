spring:
  application:
    name: arepos-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arepos}
    username: ${DB_USERNAME:arepos}
    password: ${DB_PASSWORD:arepos}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/plain,text/html

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    prometheus:
      access: read_only

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

arepos:
  audit:
    retention: ${AUDIT_RETENTION:PT24H}
    cleanup-cron: ${AUDIT_CLEANUP_CRON:0 0 * * * *}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-must-be-at-least-256-bits-long!!}
    access-expiration: ${JWT_ACCESS_EXPIRATION:PT30M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P7D}
  admin-secret: ${ADMIN_SECRET:}
  authz:
    cerbos:
      enabled: false
      mode: DISABLED
      endpoint: http://localhost:3592
      request-timeout: 1s
      fail-open: false
      shadow-enabled: false
      enforce-enabled: false
      bundle-version: ""
  files:
    storage: ${FILE_STORAGE:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:arepos-files}