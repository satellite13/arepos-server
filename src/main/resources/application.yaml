spring:
  application:
    name: arepos-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arepos}
    username: ${DB_USERNAME:arepos}
    password: ${DB_PASSWORD:arepos}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: ${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:50}
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:50}
          order_inserts: ${HIBERNATE_ORDER_INSERTS:true}
          order_updates: ${HIBERNATE_ORDER_UPDATES:true}
        cache:
          use_second_level_cache: ${HIBERNATE_USE_SECOND_LEVEL_CACHE:true}
          region:
            factory_class: jcache
        javax:
          cache:
            provider: org.ehcache.jsr107.EhcacheCachingProvider
            uri: classpath:ehcache.xml
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/plain,text/html

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    prometheus:
      access: read_only

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

arepos:
  # Публичная база URL для формирования внешних ссылок (например, share-link preview SVG).
  # Пример: https://api.example.com
  public-url-base: ${AREPOS_PUBLIC_URL_BASE:}
  model-sync:
    # Публикация model_changed через transactional outbox (иначе — прямой SimpMessagingTemplate).
    outbox-enabled: ${MODEL_SYNC_OUTBOX_ENABLED:false}
    outbox-publish-interval-ms: ${MODEL_SYNC_OUTBOX_PUBLISH_MS:500}
    outbox-batch-size: ${MODEL_SYNC_OUTBOX_BATCH_SIZE:50}
  audit:
    retention: ${AUDIT_RETENTION:PT24H}
    cleanup-cron: ${AUDIT_CLEANUP_CRON:0 0 * * * *}
  websocket:
    # Список через запятую или * (dev). Для prod задать явные origin фронта.
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:*}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:arepos}
    audience: ${JWT_AUDIENCE:arepos-api}
    access-expiration: ${JWT_ACCESS_EXPIRATION:PT30M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P7D}
  admin-secret: ${ADMIN_SECRET:}
  authz:
    cerbos:
      endpoint: http://localhost:3592
      request-timeout: 1s
      bundle-version: ""
      batch-chunk-size: ${CERBOS_BATCH_CHUNK_SIZE:50}
      circuit-failure-threshold: ${CERBOS_CIRCUIT_FAILURE_THRESHOLD:5}
      circuit-open-duration: ${CERBOS_CIRCUIT_OPEN_DURATION:PT30S}
  files:
    storage: ${FILE_STORAGE:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:arepos-files}

logging:
  level:
    ru.kavader.arepos: INFO