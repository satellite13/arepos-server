arepos:
  auth:
    # Prod default off; override with AREPOS_AUTH_REGISTRATION_ENABLED=true when open signup is desired.
    registration-enabled: ${AREPOS_AUTH_REGISTRATION_ENABLED:false}
    cookie-secure: true
  swagger:
    enabled: false

server:
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
