# Values for deploying arepos-server to Kubernetes

replicaCount: 1

image:
  repository: arch/arepos-server
  pullPolicy: Always
  tag: "0.9.1"

# Database configuration
database:
  host: postgres.default.svc.cluster.local
  port: 5432
  name: arepos
  username: arepos
  password: "arepos"
  # For production, use existingSecret instead:
  # existingSecret: postgresql-secret

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Enable ingress if needed
ingress:
  enabled: false

# MinIO (enabled by default in values.yaml)
minio:
  enabled: true

# Additional environment variables
env:
  - name: BPL_JVM_THREAD_COUNT
    value: "50"
  - name: BPL_JVM_HEAD_ROOM
    value: "0"
  # JWT configuration
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: arepos-server-auth-secret
        key: jwt-secret
  - name: ADMIN_SECRET
    valueFrom:
      secretKeyRef:
        name: arepos-server-auth-secret
        key: admin-secret
  # Model live sync: transactional outbox для STOMP model_changed (см. docs/ops/model-sync-outbox-runbook.md)
  - name: MODEL_SYNC_OUTBOX_ENABLED
    value: "true"
  # Shared SSO between warchi and warchi-site on *.arch.svc.cluster.local (Orbstack/k8s).
  - name: AREPOS_AUTH_COOKIE_DOMAIN
    value: ".arch.svc.cluster.local"
  # Ehcache sizeof on JDK 24+ requires reflective access to java.base.
  - name: JAVA_TOOL_OPTIONS
    value: "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED"
  # При необходимости:
  # - name: MODEL_SYNC_OUTBOX_PUBLISH_MS
  #   value: "500"
  # - name: MODEL_SYNC_OUTBOX_BATCH_SIZE
  #   value: "50"

# Cerbos defaults for local deploy.sh.
# Keep this block aligned with infra values to avoid rollout drift.
cerbos:
  deploy: true
  enabled: true
  timeoutMs: 1000
  bundleVersion: ""

