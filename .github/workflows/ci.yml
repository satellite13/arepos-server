# CI for GitHub Actions and GitVerse.
# GitVerse-compatible: only actions mirrored on gitverse.ru are used
# (gradle/actions and azure/setup-helm have no mirror there; no sudo/apt
# — GitVerse job containers run as root without sudo).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.jvmargs=-Xmx2g

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  authz:
    name: Cerbos-only checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz -o /tmp/rg.tgz
          tar -xzf /tmp/rg.tgz -C /tmp
          mv /tmp/ripgrep-14.1.1-x86_64-unknown-linux-musl/rg /tmp/rg
          echo "/tmp" >> "$GITHUB_PATH"
          rg --version

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Verify Cerbos-only authorization
        run: bash ./scripts/verify-cerbos-only.sh

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          mv /tmp/linux-amd64/helm /tmp/helm
          echo "/tmp" >> "$GITHUB_PATH"
          helm version --short

      - name: Lint and render chart
        run: |
          set -euo pipefail
          helm lint ./charts/arepos-server
          helm template ci-arepos ./charts/arepos-server \
            --values ./charts/arepos-server/values.yaml \
            --namespace arch \
            > /tmp/arepos-manifests.yaml
          # Smoke-check rendered manifests (no cluster required)
          test -s /tmp/arepos-manifests.yaml
          grep -q '^kind: Deployment$' /tmp/arepos-manifests.yaml
          grep -q '^kind: Service$' /tmp/arepos-manifests.yaml
          bash -n ./scripts/deploy.sh
          bash -n ./scripts/undeploy.sh
          bash -n ./scripts/helmCheck.sh
          bash -n ./scripts/verify-cerbos-only.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t arepos-server:ci .
