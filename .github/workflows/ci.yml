name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.jvmargs=-Xmx2g

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  authz:
    name: Cerbos-only checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Verify Cerbos-only authorization
        run: bash ./scripts/verify-cerbos-only.sh

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Lint and dry-run chart
        run: |
          set -euo pipefail
          # kubectl client dry-run does not need a cluster, but needs a kubeconfig file
          mkdir -p "$HOME/.kube"
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters: []' \
            'contexts: []' \
            'users: []' > "$HOME/.kube/config"
          helm lint ./charts/arepos-server
          helm template ci-arepos ./charts/arepos-server \
            --values ./charts/arepos-server/values.yaml \
            --namespace arch \
            > /tmp/arepos-manifests.yaml
          kubectl apply --dry-run=client -f /tmp/arepos-manifests.yaml
          bash -n ./scripts/deploy.sh
          bash -n ./scripts/undeploy.sh
          bash -n ./scripts/helmCheck.sh
          bash -n ./scripts/verify-cerbos-only.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: arepos-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
