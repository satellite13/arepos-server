apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: node_type
  rules:
    - name: admin-all
      actions: ["*"]
      effect: EFFECT_ALLOW
      roles:
        - ADMIN

    - name: owner-view-edit
      actions: ["view", "edit"]
      effect: EFFECT_ALLOW
      roles:
        - USER
        - EDITOR
      condition:
        match:
          expr: request.resource.attr.isOwner == true

    - name: shared-view
      actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - USER
        - EDITOR
      condition:
        match:
          expr: request.resource.attr.hasShareView == true

    - name: shared-edit
      actions: ["edit"]
      effect: EFFECT_ALLOW
      roles:
        - USER
        - EDITOR
      condition:
        match:
          expr: request.resource.attr.hasShareEdit == true
