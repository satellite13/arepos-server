# nonk8s
# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: feedback_item
  rules:
    - name: admin-all
      actions: ["*"]
      effect: EFFECT_ALLOW
      roles:
        - ADMIN

    - name: anyone-view
      actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - USER
        - EDITOR
        - ADMIN

    - name: authenticated-create-vote-comment
      actions: ["create", "vote", "comment"]
      effect: EFFECT_ALLOW
      roles:
        - USER
        - EDITOR
        - ADMIN

    - name: author-edit-delete-when-new
      actions: ["edit", "delete"]
      effect: EFFECT_ALLOW
      roles:
        - USER
        - EDITOR
        - ADMIN
      condition:
        match:
          expr: request.resource.attr.isAuthor == true && request.resource.attr.status == "new"
