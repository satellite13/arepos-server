apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: share
  rules:
    - name: admin-manage
      actions: ["manage"]
      effect: EFFECT_ALLOW
      roles:
        - ADMIN

    - name: owner-manage
      actions: ["manage"]
      effect: EFFECT_ALLOW
      roles:
        - USER
        - EDITOR
      condition:
        match:
          expr: request.resource.attr.isOwner == true
