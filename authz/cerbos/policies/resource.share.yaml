# nonk8s
# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: share
  rules:
    - name: admin-manage
      actions: ["manage"]
      effect: EFFECT_ALLOW
      roles:
        - admin

    - name: owner-manage
      actions: ["manage"]
      effect: EFFECT_ALLOW
      roles:
        - reader
        - editor
      condition:
        match:
          expr: request.resource.attr.isOwner == true
