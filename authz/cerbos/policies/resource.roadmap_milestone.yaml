# nonk8s
# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: roadmap_milestone
  rules:
    - name: admin-all
      actions: ["*"]
      effect: EFFECT_ALLOW
      roles:
        - ADMIN

    - name: anyone-view
      actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - USER
        - EDITOR
        - ADMIN
