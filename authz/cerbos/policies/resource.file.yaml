apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: file
  rules:
    - name: admin-all
      actions: ["*"]
      effect: EFFECT_ALLOW
      roles:
        - ADMIN

    - name: owner-view
      actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - USER
        - EDITOR
      condition:
        match:
          expr: request.principal.id == request.resource.attr.ownerId
